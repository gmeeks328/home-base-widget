<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waxahachie Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  /* Layout: full-bleed map; title chip top-left, zoom + recenter top-right, one control bar at the bottom. */
  :root {
    --bg: #F3F6F5;
    --surface: rgba(255, 255, 255, 0.94);
    --ink: #16211D;
    --ink-muted: #56685F;
    --line: #C4D0CA;
    --accent: #2F6E62;
    --accent-ink: #FFFFFF;
    --warn: #A6791F;
    --label-bg: rgba(233, 244, 238, 0.95);
    --label-ink: #1F4E45;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --font-num: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1613; --surface: rgba(21, 31, 27, 0.94); --ink: #E8EEEA; --ink-muted: #96A89F;
      --line: #34443E; --accent: #74C2AC; --accent-ink: #0F1613; --warn: #DFB268;
      --label-bg: rgba(18, 30, 25, 0.9); --label-ink: #CFEBE1; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1613; --surface: rgba(21, 31, 27, 0.94); --ink: #E8EEEA; --ink-muted: #96A89F;
    --line: #34443E; --accent: #74C2AC; --accent-ink: #0F1613; --warn: #DFB268;
    --label-bg: rgba(18, 30, 25, 0.9); --label-ink: #CFEBE1; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.35 var(--font-ui); -webkit-font-smoothing: antialiased; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  .chip, .bar {
    position: absolute;
    z-index: 1000;
    background: var(--surface);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .chip {
    top: max(12px, env(safe-area-inset-top, 0px));
    left: max(12px, env(safe-area-inset-left, 0px));
    padding: 7px 13px 7px 12px;
    border-radius: 100px;
    display: flex; align-items: baseline; gap: 7px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .chip small { font-weight: 500; color: var(--ink-muted); font-size: 12.5px; letter-spacing: 0; }

  /* Leaflet controls, restyled and moved clear of the notch and the bottom bar */
  .leaflet-top { top: max(12px, env(safe-area-inset-top, 0px)); }
  .leaflet-right { right: max(12px, env(safe-area-inset-right, 0px)); }
  .leaflet-bottom { bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 92px); }
  .leaflet-left { left: max(12px, env(safe-area-inset-left, 0px)); }
  .leaflet-touch .leaflet-bar { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: none; }
  .leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--ink); border-bottom-color: var(--line); width: 40px; height: 40px; line-height: 40px; font-size: 20px; }
  .leaflet-bar a.recenter { font-size: 18px; text-decoration: none; text-align: center; display: block; }
  .leaflet-control-attribution { font-size: 10px; background: var(--surface) !important; color: var(--ink-muted); border-radius: 8px 0 0 0; }
  .leaflet-control-attribution a { color: var(--ink-muted); }

  .bar {
    left: max(12px, env(safe-area-inset-left, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    bottom: max(12px, env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 11px 16px 10px 12px;
    border-radius: 18px;
    max-width: 560px;
    margin: 0 auto;
  }
  button#play {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 16px;
    cursor: pointer;
  }
  button#play:focus-visible, input[type="range"]:focus-visible, .leaflet-bar a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .mid { min-width: 0; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; display: block; }
  .ticks { display: flex; justify-content: space-between; align-items: center; gap: 8px; white-space: nowrap; margin-top: 3px; font-family: var(--font-num); font-size: 10.5px; color: var(--ink-muted); }
  .legend {
    position: absolute; z-index: 1000;
    top: calc(max(12px, env(safe-area-inset-top, 0px)) + 46px);
    left: max(12px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 100px;
    background: var(--surface); border: 1px solid var(--line);
    font-family: var(--font-num); font-size: 10.5px; color: var(--ink-muted);
  }
  .legend i { display: block; width: 54px; height: 6px; border-radius: 6px; background: linear-gradient(90deg, #7be07b, #2da02d, #f4e842, #f59b2f, #e0302a, #c21fb4); }
  .legend[hidden] { display: none; }

  .when { text-align: right; min-width: 88px; }
  .when b { display: block; font-family: var(--font-num); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .when span { font-size: 12px; color: var(--ink-muted); }
  .when span.fc { color: var(--warn); font-weight: 700; }

  .msg {
    position: absolute; z-index: 1001; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: min(420px, calc(100% - 32px));
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    text-align: center;
  }
  .msg[hidden] { display: none; }
  .toast {
    position: absolute; z-index: 1002; left: 50%; transform: translateX(-50%);
    bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 128px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 100px;
    padding: 6px 14px; font-weight: 600; font-size: 13px;
  }
  .toast[hidden] { display: none; }
  .leaflet-bar a svg { vertical-align: middle; margin-top: -3px; }

  /* Place names: centered on their point; pill background keeps them readable over radar */
  .anchor { width: 0; height: 0; }
  .city {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    white-space: nowrap;
    padding: 1px 6px;
    border-radius: 7px;
    background: var(--label-bg);
    color: var(--label-ink);
    font-weight: 600;
    box-shadow: 0 0 0 1px rgba(47, 110, 98, 0.28);
    pointer-events: none;
  }
  .city.t1 { font-size: 13px; font-weight: 700; }
  .city.t2 { font-size: 11.5px; }
  .city.t3 { font-size: 10.5px; color: var(--ink-muted); font-weight: 500; }

  .home { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
  .home i { display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--accent), 0 2px 6px rgba(0,0,0,0.25); }
  .home b { padding: 2px 8px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) {
    .home i { animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,110,98,0.5), 0 2px 6px rgba(0,0,0,0.25); } 70% { box-shadow: 0 0 0 14px rgba(47,110,98,0), 0 2px 6px rgba(0,0,0,0.25); } 100% { box-shadow: 0 0 0 0 rgba(47,110,98,0), 0 2px 6px rgba(0,0,0,0.25); } }
  }
</style>
</head>
<body>

  <div id="map" role="application" aria-label="Weather radar map"></div>

  <div class="chip">Radar<small>Waxahachie, TX</small></div>
  <div class="legend" id="legend" hidden><span>light</span><i></i><span>heavy</span></div>

  <div class="msg" id="msg" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <div class="bar">
    <button id="play" type="button" aria-label="Pause">❚❚</button>
    <div class="mid">
      <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Radar frame">
      <div class="ticks"><span id="t0">&nbsp;</span><span id="t1">&nbsp;</span></div>
    </div>
    <div class="when"><b id="t">--:--</b><span id="rel">loading</span></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  var HOME = [32.386, -96.848];
  var HOME_ZOOM = 8;
  var FEED = "https://api.rainviewer.com/public/weather-maps.json";
  var FRAME_MS = 600;
  var HOLD_MS = 1800;
  var REFRESH_MS = 5 * 60 * 1000;
  var RADAR_NATIVE_ZOOM = 7;
  var SCHEME = 6;           // NEXRAD-style greens to reds; falls back to 2 (blue) if those tiles will not load
  var RADAR_OPACITY = 0.85;

  var map = L.map("map", { center: HOME, zoom: HOME_ZOOM, minZoom: 5, maxZoom: 10, zoomControl: false, attributionControl: false });
  L.control.zoom({ position: "topright" }).addTo(map);
  L.control.attribution({ position: "bottomright", prefix: '<a href="https://leafletjs.com">Leaflet</a>' }).addTo(map);

  // Recenter button under the zoom buttons
  var Recenter = L.Control.extend({
    options: { position: "topright" },
    onAdd: function () {
      var box = L.DomUtil.create("div", "leaflet-bar");
      var a = L.DomUtil.create("a", "recenter", box);
      a.href = "#"; a.title = "Back to Waxahachie"; a.setAttribute("role", "button"); a.setAttribute("aria-label", "Back to Waxahachie");
      a.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
      L.DomEvent.disableClickPropagation(box);
      L.DomEvent.on(a, "click", function (e) { L.DomEvent.preventDefault(e); map.flyTo(HOME, HOME_ZOOM, { duration: 0.6 }); });
      return box;
    }
  });
  new Recenter().addTo(map);

  // The base map lives in its own pane under the radar so it can be restyled without touching the radar.
  map.createPane("base");
  map.getPane("base").style.zIndex = 150;

  var styleSync = function () {};
  var toastTimer = null;
  function toast(text) {
    var t = document.getElementById("toast");
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 1600);
  }

  // Map style button: cycles Streets, Satellite, Light gray
  var StyleBtn = L.Control.extend({
    options: { position: "topright" },
    onAdd: function () {
      var box = L.DomUtil.create("div", "leaflet-bar");
      var a = L.DomUtil.create("a", "recenter", box);
      a.href = "#"; a.setAttribute("role", "button");
      a.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg>';
      function sync() { a.title = "Map style: " + style().name + " (tap to change)"; a.setAttribute("aria-label", a.title); }
      sync();
      styleSync = sync;
      L.DomEvent.disableClickPropagation(box);
      L.DomEvent.on(a, "click", function (e) {
        L.DomEvent.preventDefault(e);
        styleIdx = (styleIdx + 1) % STYLES.length;
        try { localStorage.setItem("radar_style", style().id); } catch (err) {}
        sync(); setBase(); toast(style().name);
      });
      return box;
    }
  });

  // ---- basemap (keyless Esri tiles; OpenStreetMap if they refuse to load) ----
  var dark = window.matchMedia("(prefers-color-scheme: dark)");
  var theme = document.documentElement.getAttribute("data-theme");
  function wantsDark() { return theme ? theme === "dark" : dark.matches; }
  var SERVICES = "https://server.arcgisonline.com/ArcGIS/rest/services/";

  // ---- terrain recoloring: water to blue, vegetation to green, bare land to brown, keeping the relief shading ----
  var recolorOk = true;
  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
    if (d) {
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hsl2rgb(h, s, l) {
    var c = (1 - Math.abs(2 * l - 1)) * s, hp = h / 60, x = c * (1 - Math.abs(hp % 2 - 1)), r = 0, g = 0, b = 0;
    if (hp < 1) { r = c; g = x; } else if (hp < 2) { r = x; g = c; } else if (hp < 3) { g = c; b = x; }
    else if (hp < 4) { g = x; b = c; } else if (hp < 5) { r = x; b = c; } else { r = c; b = x; }
    var m = l - c / 2;
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }
  function recolor(px) {
    for (var i = 0; i < px.length; i += 4) {
      if (px[i + 3] === 0) continue;
      var hsl = rgb2hsl(px[i], px[i + 1], px[i + 2]), h = hsl[0], s = hsl[1], l = hsl[2];
      // Esri's land is very pale (high lightness) and its ocean is darker, even when both share a cool tint,
      // so lightness decides water vs land and saturation decides dry (brown) vs vegetated (green).
      if (h >= 125 && h <= 265 && s > 0.03 && l < 0.87) { h = 208; s = Math.min(0.75, s * 2.6 + 0.4); l = l * 0.92; }   // water
      else {
        var t = Math.max(0, Math.min(1, (s - 0.04) / 0.14)); if (l < 0.6) t = Math.max(t, 0.7);
        h = 30 + 80 * t; s = 0.30 + 0.25 * t; l = Math.min(l, 0.9) * (0.93 - 0.1 * t);
      }
      var c = hsl2rgb(h, s, l);
      px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2];
    }
  }
  var RecolorTerrain = L.GridLayer.extend({
    createTile: function (coords, done) {
      var size = this.getTileSize();
      var tile = L.DomUtil.create("canvas", "leaflet-tile");
      tile.width = size.x; tile.height = size.y;
      var url = L.Util.template(SERVICES + "World_Terrain_Base/MapServer/tile/{z}/{y}/{x}", coords);
      function paint(img, canRecolor) {
        var ctx = tile.getContext("2d");
        ctx.drawImage(img, 0, 0, size.x, size.y);
        if (canRecolor) {
          try {
            var data = ctx.getImageData(0, 0, size.x, size.y);
            recolor(data.data);
            ctx.putImageData(data, 0, 0);
          } catch (e) { recolorOk = false; applyBaseFilter(); }
        }
        done(null, tile);
      }
      function load(cors) {
        var img = new Image();
        if (cors) img.crossOrigin = "anonymous";
        img.onload = function () { paint(img, cors); };
        img.onerror = function () {
          if (cors) { recolorOk = false; applyBaseFilter(); load(false); } else { done(new Error("tile"), tile); }
        };
        img.src = url;
      }
      load(true);
      return tile;
    }
  });
  // If the browser will not let us read the tile pixels, fall back to a plain saturation boost.
  function applyBaseFilter() {
    var invert = wantsDark() && useOsm;
    var fx = [];
        // The topographic map is pale by design; push its greens, blues and tans so land, water and roads separate clearly.
    if (!useOsm && style().id === "terrain") fx.push("hue-rotate(14deg) saturate(2.6) contrast(1.12) brightness(0.98)");  // hue shift nudges yellow-greens toward true green; plain CSS so every browser applies it
    if (invert) fx.push("invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.95)");
    map.getPane("base").style.filter = fx.length ? fx.join(" ") : "none";
  }
  var STYLES = [
    { id: "terrain", name: "Topographic", labels: false },
    { id: "satellite", name: "Satellite", labels: true },
    { id: "gray", name: "Light gray", labels: true }
  ];
  var styleIdx = 0;
  try {
    var savedStyle = localStorage.getItem("radar_style");
    STYLES.forEach(function (st, i) { if (st.id === savedStyle) styleIdx = i; });
  } catch (e) {}
  var baseLayer = null;
  var useOsm = false;
  function style() { return STYLES[styleIdx]; }
  function styleIndex(id) { for (var i = 0; i < STYLES.length; i++) { if (STYLES[i].id === id) return i; } return 0; }
  function labelsOn() { return !useOsm && style().labels; }
  function tileUrl() {
    var id = style().id;
    if (id === "satellite") return SERVICES + "World_Imagery/MapServer/tile/{z}/{y}/{x}";
    if (id === "gray") return SERVICES + "Canvas/" + (wantsDark() ? "World_Dark_Gray_Base" : "World_Light_Gray_Base") + "/MapServer/tile/{z}/{y}/{x}";
    return SERVICES + "World_Street_Map/MapServer/tile/{z}/{y}/{x}";
  }
  function setBase() {
    if (baseLayer) map.removeLayer(baseLayer);
    var credit = ' | Radar: <a href="https://www.rainviewer.com/">RainViewer</a>';
    if (useOsm) {
      baseLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        pane: "base", maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' + credit
      });
    } else if (style().id === "terrain") {
      // Esri's topographic map: green vegetation, tan land, blue water, with its own roads and names baked in.
      var tLoaded = 0, tErrors = 0;
      baseLayer = L.tileLayer(SERVICES + "World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { pane: "base", maxZoom: 19, attribution: 'Tiles &copy; Esri' + credit });
      baseLayer.on("tileload", function () { tLoaded++; });
      baseLayer.on("tileerror", function () {
        tErrors++;
        if (!tLoaded && tErrors >= 4 && style().id === "terrain") {
          styleIdx = styleIndex("gray");
          setBase();
          styleSync();
          toast("Topographic not available, showing Light gray");
        }
      });
    } else {
      var loaded = 0, errors = 0;
      baseLayer = L.tileLayer(tileUrl(), { pane: "base", maxZoom: 19, attribution: 'Tiles &copy; Esri' + credit });
      baseLayer.on("tileload", function () { loaded++; });
      baseLayer.on("tileerror", function () {
        errors++;
        if (!loaded && errors >= 4 && !useOsm) { useOsm = true; setBase(); }
      });
    }
    baseLayer.addTo(map);
    // Bright street and OSM tiles get darkened in dark mode; the radar sits in a different pane and is untouched.
    applyBaseFilter();
    applyLabelMode();
  }

  // ---- place names: our own, decluttered so they never overlap ----
  // [name, lat, lon, tier]  tier 1 shows from zoom 6, tier 2 from 8, tier 3 from 9
  var CITIES = [
    ["Dallas", 32.7767, -96.7970, 1], ["Fort Worth", 32.7555, -97.3308, 1], ["Waco", 31.5493, -97.1467, 1],
    ["Tyler", 32.3513, -95.3011, 1], ["Austin", 30.2672, -97.7431, 1], ["Houston", 29.7604, -95.3698, 1],
    ["Killeen", 31.1171, -97.7278, 1], ["Longview", 32.5007, -94.7405, 1],
    ["Arlington", 32.7357, -97.1081, 2], ["Plano", 33.0198, -96.6989, 2], ["Denton", 33.2148, -97.1331, 2],
    ["Corsicana", 32.0954, -96.4689, 2], ["Cleburne", 32.3476, -97.3867, 2], ["Temple", 31.0982, -97.3428, 2],
    ["Sherman", 33.6357, -96.6089, 2], ["Greenville", 33.1384, -96.1106, 2], ["Weatherford", 32.7593, -97.7976, 2],
    ["Palestine", 31.7621, -95.6308, 2], ["Bryan", 30.6744, -96.3699, 2], ["McKinney", 33.1972, -96.6398, 2],
    ["Ennis", 32.3293, -96.6253, 3], ["Midlothian", 32.4824, -96.9945, 3], ["Mansfield", 32.5632, -97.1417, 3],
    ["Hillsboro", 32.0118, -97.1250, 3], ["Terrell", 32.7360, -96.2753, 3], ["Athens", 32.2049, -95.8555, 3],
    ["Mexia", 31.6799, -96.4822, 3], ["Lancaster", 32.5921, -96.7561, 3], ["Cedar Hill", 32.5885, -96.9561, 3],
    ["Rockwall", 32.9312, -96.4597, 3], ["Granbury", 32.4421, -97.7942, 3], ["Red Oak", 32.5176, -96.8044, 3]
  ];
  var TIER_ZOOM = { 1: 6, 2: 8, 3: 9 };

  var homeMarker = L.marker(HOME, {
    icon: L.divIcon({ className: "anchor", html: '<div class="home"><i></i><b>Waxahachie</b></div>', iconSize: [0, 0] }),
    interactive: false, keyboard: false, zIndexOffset: 1000
  }).addTo(map);

  var cityMarkers = CITIES.map(function (c) {
    var m = L.marker([c[1], c[2]], {
      icon: L.divIcon({ className: "anchor", html: '<span class="city t' + c[3] + '">' + c[0] + '</span>', iconSize: [0, 0] }),
      interactive: false, keyboard: false
    }).addTo(map);
    return { marker: m, minZoom: TIER_ZOOM[c[3]] };
  });

  function applyLabelMode() {
    // Our green name tags show on every style except the OpenStreetMap fallback, which carries its own names.
    if (!labelsOn()) {
      cityMarkers.forEach(function (c) { var el = c.marker.getElement(); if (el) el.style.display = "none"; });
      return;
    }
    declutter();
  }

  function declutter() {
    if (!labelsOn()) return;
    var z = map.getZoom();
    var placed = [];
    var hEl = homeMarker.getElement();
    if (hEl) placed.push(hEl.getBoundingClientRect());
    var mapRect = document.getElementById("map").getBoundingClientRect();
    cityMarkers.forEach(function (c) {
      var el = c.marker.getElement();
      if (!el) return;
      if (z < c.minZoom) { el.style.display = "none"; return; }
      el.style.display = "";
      var r = el.firstChild.getBoundingClientRect();
      // Hide any label that would be cut off by the screen edge, not just fully offscreen ones.
      var offscreen = r.left < mapRect.left + 4 || r.right > mapRect.right - 4 || r.top < mapRect.top + 4 || r.bottom > mapRect.bottom - 4;
      var pad = 4;
      var clash = placed.some(function (p) { return r.left < p.right + pad && r.right > p.left - pad && r.top < p.bottom + pad && r.bottom > p.top - pad; });
      if (clash || offscreen) { el.style.display = "none"; } else { placed.push(r); }
    });
  }
  map.on("zoomend moveend", declutter);
  setBase();
  if (dark.addEventListener) dark.addEventListener("change", setBase);
  new StyleBtn().addTo(map);

  // ---- radar ----
  var frames = [];
  var layers = [];
  var current = 0;
  var playing = true;
  var timer = null;

  var slider = document.getElementById("slider");
  var playBtn = document.getElementById("play");
  var tEl = document.getElementById("t");
  var relEl = document.getElementById("rel");
  var t0El = document.getElementById("t0");
  var t1El = document.getElementById("t1");
  var legend = document.getElementById("legend");
  var msg = document.getElementById("msg");

  function showMsg(text) { msg.textContent = text; msg.hidden = false; }
  function hideMsg() { msg.hidden = true; }
  function tickClock(sec) { return clock(sec).replace(/\s?[AP]M$/i, ""); }
  function clock(sec) { return new Date(sec * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

  function clearLayers() { layers.forEach(function (l) { map.removeLayer(l); }); layers = []; }

  function show(i) {
    if (!layers.length) return;
    current = i;
    layers.forEach(function (l, idx) { l.setOpacity(idx === i ? RADAR_OPACITY : 0); });
    slider.value = i;
    var f = frames[i];
    tEl.textContent = clock(f.time);
    var mins = Math.round((f.time * 1000 - Date.now()) / 60000);
    if (f.nowcast) {
      relEl.textContent = "forecast +" + Math.max(mins, 0) + " min";
      relEl.className = "fc";
    } else {
      relEl.textContent = mins >= -2 ? "now" : Math.abs(mins) + " min ago";
      relEl.className = "";
    }
  }

  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    var next = (current + 1) % frames.length;
    var wait = (current === frames.length - 1) ? HOLD_MS : FRAME_MS;
    timer = setTimeout(function () { show(next); schedule(); }, wait);
  }

  function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? "❚❚" : "▶";
    playBtn.setAttribute("aria-label", on ? "Pause" : "Play");
    if (on) schedule(); else clearTimeout(timer);
  }

  playBtn.addEventListener("click", function () { setPlaying(!playing); });
  slider.addEventListener("input", function () { setPlaying(false); show(+slider.value); });

  function load() {
    fetch(FEED, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        var past = (j.radar && j.radar.past) || [];
        var now = (j.radar && j.radar.nowcast) || [];
        var list = past.map(function (f) { return { time: f.time, path: f.path, nowcast: false }; })
          .concat(now.map(function (f) { return { time: f.time, path: f.path, nowcast: true }; }));
        if (!list.length) throw new Error("no frames");
        var host = j.host || "https://tilecache.rainviewer.com";
        var wasLast = frames.length && current === frames.length - 1;
        clearLayers();
        frames = list;
        var loaded = 0, errors = 0;
        layers = frames.map(function (f) {
          var l = L.tileLayer(host + f.path + "/256/{z}/{x}/{y}/" + SCHEME + "/1_1.png", {
            opacity: 0, maxNativeZoom: RADAR_NATIVE_ZOOM, maxZoom: 10, tileSize: 256, zIndex: 400
          });
          l.on("tileload", function () { loaded++; });
          l.on("tileerror", function () {
            errors++;
            if (!loaded && errors >= 6 && SCHEME !== 2) { SCHEME = 2; load(); }
          });
          return l.addTo(map);
        });
        legend.hidden = SCHEME !== 6;
        slider.max = frames.length - 1;
        t0El.textContent = tickClock(frames[0].time);
        t1El.textContent = tickClock(frames[frames.length - 1].time);
        hideMsg();
        var lastPast = 0;
        frames.forEach(function (f, i) { if (!f.nowcast) lastPast = i; });
        show(wasLast ? lastPast : Math.min(current, frames.length - 1) || 0);
        schedule();
      })
      .catch(function (e) {
        if (!frames.length) showMsg("Radar feed did not load (" + e.message + "). The map still works; try reloading in a minute.");
      });
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
